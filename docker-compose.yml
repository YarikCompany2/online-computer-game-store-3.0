services:
  db:
    image: postgres:15-alpine
    container_name: gamestore_db
    restart: always
    env_file:
    - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamestore_api
    restart: always
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gamestore_ui
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  pgdata:
  uploads_data: